name: Work proposal
description: Propose a considered change to OOMPF
title: "[Proposal]: "
labels: ["needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or user need
      description: Describe the observed need without assuming a particular solution.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Smallest useful change
      description: State what is in scope and out of scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing behavior and alternatives
      description: Explain why existing features or a no-code/process change do not solve the problem.
    validations:
      required: true
  - type: checkboxes
    id: risk
    attributes:
      label: Risk areas
      options:
        - label: Public API
        - label: Dependency change
        - label: Security, authentication, or authorization
        - label: CI, build, release, policy, or agent instructions
        - label: Large generated or mechanical change
        - label: None of the above
