name: Bug report
description: Report a reproducible defect in OOMPF
title: "[Bug]: "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: Do not report OOMPF vulnerabilities here. Follow SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest deterministic steps, code, or repository that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Project version or commit, OS/runtime, and relevant configuration.
    validations:
      required: true
