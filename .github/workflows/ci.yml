name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run focused tests
        run: bun run test

      - name: Typecheck packages
        run: bun run typecheck

      - name: Astro check
        run: bun run --filter='@oompf/web' typecheck

      - name: Build workspace
        run: bun run build

      - name: CLI help smoke
        run: bun apps/cli/src/index.ts --help

      - name: End-to-end local smoke
        run: bun run smoke:local
