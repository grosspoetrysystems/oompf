name: Release CLI

# Cutting a release is pushing a tag:
#
#   npm version patch --workspace apps/cli   # or edit the manifest
#   git tag cli-v0.1.1 && git push origin cli-v0.1.1
#
# Authentication is npm trusted publishing (OIDC) — there is no NPM_TOKEN in
# this repository. Configure the trusted publisher once, in the package's
# settings on npmjs.com, pointing at this workflow filename. Because trusted
# publishing is configured per package, the very first version must be
# published by hand; every release after that goes through here.
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for OIDC. Without it npm cannot mint a publish token and the
  # publish fails with ENEEDAUTH.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish oompf to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm >= 11.5.1 and Node >= 22.14 are required for trusted publishing.
      # Caching is deliberately disabled: a release must build from a clean
      # dependency tree.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing is a hard version floor, not a preference: an older
      # npm silently ignores the OIDC environment and fails with ENEEDAUTH,
      # which reads like a credentials problem rather than a toolchain one.
      - name: npm must support trusted publishing
        run: |
          set -euo pipefail
          node -e '
            const need = [11, 5, 1];
            const have = process.argv[1].split(".").map(Number);
            const delta =
              have[0] - need[0] || have[1] - need[1] || have[2] - need[2];
            if (delta < 0) {
              console.error(
                `::error::npm ${process.argv[1]} cannot use trusted publishing; needs >= ${need.join(".")}`
              );
              process.exit(1);
            }
            console.log(`npm ${process.argv[1]} supports trusted publishing`);
          ' "$(npm --version)"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The same gate as CI. A release is not a special case that gets to skip
      # verification; it is the one that most needs it.
      - name: Verify
        run: |
          bun run lint
          bun run knip
          bun run test
          bun run typecheck
          bun run --filter='@oompf/web' typecheck
          bun run build
          bun scripts/check-migrations.ts

      - name: Package contents and manifest
        run: bun scripts/check-package.ts

      # A mistagged release publishes the wrong bytes under the right name,
      # which cannot be undone after 72 hours. Refuse instead.
      - name: Tag must match the manifest version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#cli-v}"
          MANIFEST="$(node -p "require('./apps/cli/package.json').version")"
          echo "tag=$TAG manifest=$MANIFEST"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match apps/cli/package.json version ${MANIFEST}"
            exit 1
          fi

      # Name and version both come from the manifest. Hardcoding the name here
      # once meant this guard queried a package that does not exist, so it
      # could never fire — a check that cannot fail is worse than no check.
      - name: Confirm the version is unpublished
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./apps/cli/package.json').name")"
          VERSION="$(node -p "require('./apps/cli/package.json').version")"
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "::error::${NAME}@${VERSION} is already published; bump the version"
            exit 1
          fi
          echo "${NAME}@${VERSION} is unpublished"

      # No --provenance flag: trusted publishing attaches provenance
      # automatically, and passing it explicitly is redundant.
      - name: Publish
        run: npm publish
        working-directory: apps/cli

      # The inline version of this failed on 0.1.1 while the publish itself
      # succeeded: it retried for 50 seconds against a packument npm had cached
      # on the first attempt, so it could not have observed the new version no
      # matter how long it waited. The script waits minutes, discards the cache
      # between attempts, and can be run by hand against any published version.
      - name: Smoke the published package
        run: bun scripts/smoke-published.ts
