name: contribution-policy-tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-validator:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out pull request code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the contribution scripts
        run: python3 -m unittest discover -s tests -v
